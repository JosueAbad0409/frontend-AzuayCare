<div class="student-layout">
  <header class="top-header">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <i class="fas fa-heartbeat"></i>
      </div>
      <div class="brand-info">
        <h1>AzuayCare</h1>
        <span>Portal Estudiantil</span>
      </div>
    </div>

    <nav class="desktop-nav" aria-label="Navegación principal">
      <a routerLink="/estudiante/inicio" routerLinkActive="active" class="nav-link">
        <i class="fas fa-home"></i> Inicio
      </a>
      <a routerLink="/estudiante/ficha" routerLinkActive="active" class="nav-link">
        <i class="fas fa-file-alt"></i> Mi Ficha
      </a>
      <a routerLink="/estudiante/documentos" routerLinkActive="active" class="nav-link">
        <i class="fas fa-folder-open"></i> Documentos
      </a>
      <a routerLink="/estudiante/perfil" routerLinkActive="active" class="nav-link">
        <i class="fas fa-user-circle"></i> Perfil
      </a>
    </nav>

    <div class="header-actions">
      <div class="user-greeting">
        Hola, <strong>{{ usuarioNombre() }}</strong>
      </div>
      <button class="btn-logout" (click)="logout()" aria-label="Cerrar sesión" type="button">
        <i class="fas fa-sign-out-alt"></i> <span class="logout-text">Salir</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Navegación móvil">
    <a routerLink="/estudiante/inicio" routerLinkActive="active" class="bottom-nav-item">
      <i class="fas fa-home"></i>
      <span>Inicio</span>
    </a>
    <a routerLink="/estudiante/ficha" routerLinkActive="active" class="bottom-nav-item">
      <i class="fas fa-file-alt"></i>
      <span>Ficha</span>
    </a>
    <a routerLink="/estudiante/documentos" routerLinkActive="active" class="bottom-nav-item">
      <i class="fas fa-folder-open"></i>
      <span>Archivos</span>
    </a>
    <a routerLink="/estudiante/perfil" routerLinkActive="active" class="bottom-nav-item">
      <i class="fas fa-user-circle"></i>
      <span>Perfil</span>
    </a>
  </nav>

  <button class="fab-ayuda" (click)="abrirAyuda()" aria-label="Ayuda y Soporte" type="button">
    <i class="fas fa-life-ring"></i>
  </button>

  @if (mostrarAyuda()) {
    <app-estudiante-ayuda-modal (cerrar)="cerrarAyuda()" />
  }
</div>
