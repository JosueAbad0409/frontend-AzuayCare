<div class="max-w-4xl mx-auto space-y-6 p-4 sm:p-6 animate-fade-in">
  
  <!-- CABECERA DEL FORMULARIO -->
  <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex items-center justify-between flex-wrap gap-4">
    <div>
      <h2 class="text-2xl font-extrabold text-slate-800">Ficha Socioeconómica</h2>
      <p class="text-xs text-slate-500 mt-1">Por favor responde a todas las preguntas obligatorias marcadas con (*)</p>
    </div>
    
    <div class="flex items-center gap-2">
      <span class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold border border-slate-200">
        <i class="fas fa-list-check text-indigo-600 mr-1"></i> Formulario Activo
      </span>
    </div>
  </div>

  <!-- NAVEGACIÓN PASO A PASO POR SECCIONES -->
  <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
    <button type="button" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-emerald-600 text-white shadow-md shadow-emerald-600/20">
      1. Datos Personales
    </button>
    <button type="button" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-white text-slate-600 hover:bg-slate-50 border border-slate-200">
      2. Situación Económica
    </button>
    <button type="button" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-white text-slate-600 hover:bg-slate-50 border border-slate-200">
      3. Vivienda y Salud
    </button>
  </div>

  <!-- CONTENEDOR DE PREGUNTAS -->
  <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
    
    <!-- PREGUNTA MODELO SELECCIÓN -->
    <div class="space-y-3 p-4 rounded-xl bg-slate-50/50 border border-slate-100 hover:border-slate-200 transition-all">
      <label class="block text-sm font-bold text-slate-800">
        ¿Cuál es su ocupación laboral actual? <span class="text-rose-500">*</span>
      </label>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="flex items-center p-3.5 rounded-xl bg-white border border-slate-200 hover:border-emerald-500 cursor-pointer transition-all shadow-sm">
          <input type="radio" name="ocupacion" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 border-slate-300">
          <span class="ml-3 text-xs font-semibold text-slate-700">Estudiante a tiempo completo</span>
        </label>
        
        <label class="flex items-center p-3.5 rounded-xl bg-white border border-slate-200 hover:border-emerald-500 cursor-pointer transition-all shadow-sm">
          <input type="radio" name="ocupacion" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500 border-slate-300">
          <span class="ml-3 text-xs font-semibold text-slate-700">Trabaja y estudia</span>
        </label>
      </div>
    </div>

    <!-- PREGUNTA MODELO ADJUNCIÓN DE ARCHIVO / EVIDENCIA -->
    <div class="space-y-3 p-4 rounded-xl bg-indigo-50/40 border border-indigo-100">
      <label class="block text-sm font-bold text-slate-800">
        Adjunte la planilla de servicios básicos (Luz o Agua) <span class="text-rose-500">*</span>
      </label>
      
      <div class="border-2 border-dashed border-indigo-200 rounded-xl p-6 text-center bg-white hover:bg-indigo-50/30 transition-all cursor-pointer">
        <i class="fas fa-cloud-arrow-up text-3xl text-indigo-500 mb-2"></i>
        <p class="text-xs font-bold text-slate-700">Haga clic o arrastre su archivo aquí</p>
        <p class="text-[11px] text-slate-400 mt-1">Formatos soportados: PDF, PNG, JPG (Máx. 10MB)</p>
      </div>
    </div>

    <!-- ACCIONES GUARDAR / ENVIAR -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
      <button type="button" class="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200 transition-all">
        <i class="fas fa-chevron-left mr-1"></i> Anterior
      </button>
      
      <button type="button" class="px-6 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 shadow-md shadow-emerald-600/20 transition-all flex items-center gap-2">
        Siguiente <i class="fas fa-chevron-right"></i>
      </button>
    </div>

  </div>

</div>
