<div class="max-w-3xl mx-auto p-6 bg-white rounded-lg shadow-md mt-6">
  <h2 class="text-xl font-bold text-gray-800 mb-6">⚙️ Configuración del Perfil de Atención</h2>

  <div *ngIf="mensajeExito()" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg">
    {{ mensajeExito() }}
  </div>

  <div *ngIf="mensajeError()" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg">
    {{ mensajeError() }}
  </div>

  <form [formGroup]="perfilForm" (ngSubmit)="guardar()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Título / Nombre Profesional</label>
      <input type="text" formControlName="titulo_profesional" placeholder="Ej: Ing. Juan Pérez - Coordinador Bienestar" class="w-full border rounded p-2 text-sm">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación de Oficina</label>
        <input type="text" formControlName="ubicacion_oficina" placeholder="Ej: Edificio A, Planta Baja, Oficina 102" class="w-full border rounded p-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono / Extensión</label>
        <input type="text" formControlName="telefono_contacto" placeholder="Ej: 07 4135000 ext. 104" class="w-full border rounded p-2 text-sm">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Horario de Atención</label>
      <input type="text" formControlName="horario_atencion" placeholder="Ej: Lunes a Viernes de 08:00 a 13:00" class="w-full border rounded p-2 text-sm">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mensaje de Orientación al Estudiante</label>
      <textarea formControlName="mensaje_ayuda_estudiantes" rows="3" placeholder="Ej: Si tienes problemas para llenar la sección socioeconómica, acércate a mi oficina." class="w-full border rounded p-2 text-sm"></textarea>
    </div>

    <button type="submit" [disabled]="perfilForm.invalid || loading()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">
      {{ loading() ? 'Guardando...' : 'Guardar Cambios' }}
    </button>
  </form>
</div>
