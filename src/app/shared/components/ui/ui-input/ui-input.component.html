<div class="ui-input">
  @if (label) {
    <label class="ui-input__label">{{ label }}</label>
  }
  <div class="ui-input__wrap">
    @if (icon) {
      <i class="ui-input__icon {{ icon }}"></i>
    }
    <input
      [type]="type"
      class="ui-input__field"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  </div>
  @if (hint) {
    <span class="ui-input__hint">{{ hint }}</span>
  }
</div>
