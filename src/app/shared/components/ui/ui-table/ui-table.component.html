<div class="ui-table-shell">
  <table class="ui-table">
    <thead>
      <tr>
        @for (header of headers; track header) {
          <th>{{ header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track $index) {
        <tr>
          @for (header of headers; track header) {
            <td>{{ row[header] }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
